[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stocknews"
version = "0.1.0"
description = "Day 36 of 100 Days of Code: alert with the latest news when a stock moves by 5 percent."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
notify = ["pywhatkit>=5.4"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[project.scripts]
stocknews = "stocknews.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=stocknews --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["stocknews"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["framework"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
