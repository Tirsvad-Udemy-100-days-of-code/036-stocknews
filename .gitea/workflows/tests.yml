# Tests and code metrics.
#
# Purpose:  run pytest with coverage on Python 3.13, then let the shared
#           code-metrics workflow of TirSystem/github-action (v2) publish the
#           badges to the badges branch.
# Triggers: pull_request (tests only), push to main (tests and metrics), manual.
# Inputs:   none.
# Secrets:  none; the API keys are never needed because tests use fakes.
# Changes outside the repository: the metrics job commits SVG badges to the
#           branch "badges" of this repository (push to main only).
# Milestone: MIL-001 Foundation.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run pytest
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the project with the dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the tests with coverage
        run: python -m pytest --cov-report=xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: coverage.xml

  metrics:
    name: Code metrics badges
    if: github.event_name == 'push'
    needs: tests
    permissions:
      contents: write
    uses: TirSystem/github-action/.gitea/workflows/code-metrics.yml@v2
    with:
      coverage-artifact: coverage
      coverage-report: coverage.xml
      exclude: framework
